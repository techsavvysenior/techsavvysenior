<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none">
  <style>
    .f { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SF Mono', Consolas, 'Courier New', monospace; }
    @keyframes lineIn { 0% { opacity: 0; } 6% { opacity: 1; } 100% { opacity: 1; } }
    .l1 { opacity: 0; animation: lineIn 9s linear infinite; }
    .l2 { opacity: 0; animation: lineIn 9s linear infinite; animation-delay: 1.4s; }
    .l3 { opacity: 0; animation: lineIn 9s linear infinite; animation-delay: 2.8s; }
    .l4 { opacity: 0; animation: lineIn 9s linear infinite; animation-delay: 4.2s; }
    .l5 { opacity: 0; animation: lineIn 9s linear infinite; animation-delay: 5.6s; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes wave { 0%, 100% { transform: rotate(0deg); } 15% { transform: rotate(-28deg); } 30% { transform: rotate(6deg); } 45% { transform: rotate(-28deg); } 60% { transform: rotate(0deg); } }
    .arm { transform-box: fill-box; transform-origin: 90% 90%; animation: wave 3.2s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .bub { animation: bob 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    .btn { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite; }
    @keyframes ringOut { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.28); opacity: 0; } }
    .btnring { transform-box: fill-box; transform-origin: center; animation: ringOut 2.2s ease-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    .arrow { animation: nudge 1.4s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#131B2E"/>
    </linearGradient>
    <pattern id="hdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#6366F1" opacity="0.14"/>
    </pattern>
    <clipPath id="hframe"><rect width="1000" height="230" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#hframe)">
    <rect width="1000" height="230" fill="url(#hbg)"/>
    <rect width="1000" height="230" fill="url(#hdots)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="229" rx="16" stroke="#26324A"/>
  <!-- terminal -->
  <g>
    <rect x="44" y="38" width="360" height="154" rx="10" fill="#0A0F1C" stroke="#26324A"/>
    <rect x="44" y="38" width="360" height="30" rx="10" fill="#141F33"/>
    <rect x="44" y="58" width="360" height="10" fill="#141F33"/>
    <circle cx="64" cy="53" r="5" fill="#EF4444"/>
    <circle cx="82" cy="53" r="5" fill="#F59E0B"/>
    <circle cx="100" cy="53" r="5" fill="#22C55E"/>
    <text class="mono" x="224" y="57" font-size="11" fill="#64748B" text-anchor="middle">adil@mobile-dev ~ hire</text>
    <g class="mono" font-size="14">
      <text class="l1" x="62" y="94"><tspan fill="#22C55E">$</tspan><tspan fill="#CBD5E1"> whoami</tspan></text>
      <text class="l2" x="62" y="114" fill="#94A3B8">senior_mobile_dev · top_rated_plus</text>
      <text class="l3" x="62" y="134"><tspan fill="#22C55E">$</tspan><tspan fill="#CBD5E1"> ./start_your_project.sh</tspan></text>
      <text class="l4" x="62" y="154" fill="#94A3B8">scope ✓  timeline ✓  store-ready ✓</text>
      <text class="l5" x="62" y="174"><tspan fill="#818CF8">→ waiting for your message</tspan></text>
      <rect class="cursor" x="292" y="163" width="8" height="13" fill="#818CF8"/>
    </g>
  </g>
  <!-- dev character -->
  <g>
    <circle cx="497" cy="118" r="26" fill="#1E293B" stroke="#334155"/>
    <circle cx="488" cy="112" r="3.5" fill="#A5B4FC"/>
    <circle cx="506" cy="112" r="3.5" fill="#A5B4FC"/>
    <path d="M488 126 q9 7 18 0" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M474 108 a23 23 0 0 1 46 0" fill="#6366F1"/>
    <rect x="479" y="146" width="36" height="30" rx="10" fill="#334155"/>
    <rect class="arm" x="513" y="120" width="30" height="10" rx="5" fill="#334155"/>
    <g class="bub">
      <rect x="524" y="52" width="86" height="34" rx="17" fill="#6366F1"/>
      <path d="M534 84 l-6 12 l16 -8 z" fill="#6366F1"/>
      <text class="f" x="567" y="74" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Hi there!</text>
    </g>
  </g>
  <!-- CTA -->
  <g class="f">
    <text x="660" y="86" font-size="27" font-weight="800" fill="#F8FAFC">Have a project in mind?</text>
    <text x="660" y="116" font-size="16" fill="#94A3B8">Let's ship it — fast, clean, and store-ready.</text>
    <g>
      <rect class="btnring" x="660" y="138" width="170" height="50" rx="25" fill="none" stroke="#6366F1" stroke-width="2"/>
      <g class="btn">
        <rect x="660" y="138" width="170" height="50" rx="25" fill="#6366F1"/>
        <text x="729" y="169" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">HIRE ME</text>
        <text class="arrow" x="800" y="169" font-size="19" font-weight="800" fill="#FFFFFF">→</text>
      </g>
    </g>
    <text x="660" y="212" font-size="13" fill="#64748B">⚡ Replies in 20–30 minutes · 🏆 Top Rated Plus on Upwork</text>
  </g>
</svg>
