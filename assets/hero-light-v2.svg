<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" fill="none">
  <style>
    @keyframes r1k { 0% { opacity: 1; } 21% { opacity: 1; } 26% { opacity: 0; } 96% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes rk { 0% { opacity: 0; } 4% { opacity: 1; } 22% { opacity: 1; } 27% { opacity: 0; } 100% { opacity: 0; } }
    .r1 { animation: r1k 12s linear infinite; }
    .rr { animation: rk 12s linear infinite; }
    .d3 { animation-delay: 3s; } .d6 { animation-delay: 6s; } .d9 { animation-delay: 9s; }
    @keyframes pulsek { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .pulse { animation: pulsek 2s ease-in-out infinite; }
    @keyframes ringk { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(2.6); opacity: 0; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ringk 2s ease-out infinite; }
    @keyframes spink { to { transform: rotate(360deg); } }
    .orb1 { transform-origin: 0 0; animation: spink 18s linear infinite; }
    .orb2 { transform-origin: 0 0; animation: spink 12s linear infinite reverse; }
    @keyframes driftk { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, 24px); } }
    .glow { animation: driftk 10s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glowg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#6366F1" opacity="0.16"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="280" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#dots)"/>
    <circle class="glow" cx="840" cy="80" r="220" fill="url(#glowg)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="279" rx="16" stroke="#C7D2FE"/>
  <g font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <circle class="pulse" cx="56" cy="42" r="5" fill="#16A34A"/>
    <circle class="ring" cx="56" cy="42" r="5" fill="none" stroke="#16A34A" stroke-width="1.5" opacity="0.8"/>
    <text x="72" y="47" font-size="13" font-weight="700" letter-spacing="2.5" fill="#16A34A">AVAILABLE NOW</text>
    <text x="48" y="118" font-size="50" font-weight="800" fill="url(#ng)">Adil Hussain</text>
    <g font-size="19" fill="#475569">
      <text class="r1" x="49" y="154">Senior Mobile App Developer — iOS &amp; Android</text>
      <text class="rr d3" x="49" y="154" opacity="0">React Native · Flutter · Swift · Kotlin</text>
      <text class="rr d6" x="49" y="154" opacity="0">AI-Integrated Apps — Claude &amp; OpenAI</text>
      <text class="rr d9" x="49" y="154" opacity="0">QA Leadership · Grafana · Zoho</text>
    </g>
    <g transform="translate(874,96)">
      <circle r="58" stroke="#C7D2FE" stroke-width="1" stroke-dasharray="3 7"/>
      <circle r="38" stroke="#A5B4FC" stroke-width="1"/>
      <g class="orb1"><circle cx="58" cy="0" r="4" fill="#6366F1"/></g>
      <g class="orb2"><circle cx="-38" cy="0" r="3" fill="#16A34A"/></g>
      <text font-size="20" font-weight="700" fill="#6366F1" text-anchor="middle" dominant-baseline="central">&lt;/&gt;</text>
    </g>
    <g font-size="14" font-weight="600">
      <g>
        <rect x="66" y="204" width="82" height="42" rx="21" fill="#6366F1"/>
        <text x="107" y="230" fill="#FFFFFF" font-weight="800" font-size="15" text-anchor="middle">$80/hr</text>
      </g>
      <g>
        <rect x="158" y="204" width="152" height="42" rx="21" fill="#FFFFFF" stroke="#C7D2FE"/>
        <text x="234" y="230" fill="#334155" text-anchor="middle">🏆 Top Rated Plus</text>
      </g>
      <g>
        <rect x="320" y="204" width="146" height="42" rx="21" fill="#FFFFFF" stroke="#C7D2FE"/>
        <text x="393" y="230" fill="#334155" text-anchor="middle">100% Job Success</text>
      </g>
      <g>
        <rect x="476" y="204" width="122" height="42" rx="21" fill="#FFFFFF" stroke="#C7D2FE"/>
        <text x="537" y="230" fill="#334155" text-anchor="middle">$200K+ Earned</text>
      </g>
      <g>
        <rect x="608" y="204" width="168" height="42" rx="21" fill="#FFFFFF" stroke="#C7D2FE"/>
        <text x="692" y="230" fill="#334155" text-anchor="middle">11+ Years Experience</text>
      </g>
      <g>
        <rect x="786" y="204" width="148" height="42" rx="21" fill="#FFFFFF" stroke="#C7D2FE"/>
        <text x="860" y="230" fill="#334155" text-anchor="middle">⚡ 20–30 Min Reply</text>
      </g>
    </g>
  </g>
</svg>
